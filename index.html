<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otimizador ATS & Buscador de Vagas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf.js da Mozilla -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans pb-16">

    <!-- Header Fixo -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg leading-tight">Otimizador ATS</h1>
                <p class="text-xs text-slate-400">Extração Local de PDF & Buscas Diretas</p>
            </div>
            <span class="text-xs bg-blue-600 px-2.5 py-1 rounded-full font-mono font-semibold">v3.0.0</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 space-y-5 flex-1">

        <!-- Card: Upload do PDF -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div>
                <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider mb-2">
                    📄 Selecione o Currículo (PDF)
                </h2>
                
                <input type="file" id="cvInput" accept="application/pdf" class="hidden" onchange="manipularArquivoPDF(event)">
                
                <label for="cvInput" id="uploadLabel"
                    class="w-full bg-slate-50 hover:bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl p-5 flex flex-col items-center justify-center cursor-pointer transition-all">
                    <span id="fileNameDisplay" class="text-xs font-semibold text-slate-600">Clique para selecionar o arquivo PDF</span>
                    <span class="text-[10px] text-slate-400 mt-1">Processamento seguro e privado no próprio navegador</span>
                </label>
            </div>

            <button id="btnAnalisar" onclick="analisarPDF()" disabled
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-sm text-xs transition-all flex items-center justify-center gap-2">
                <span id="btnText">🚀 Analisar e Engatilhar Queries</span>
                <span id="btnSpinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </section>

        <!-- Container de Alerta -->
        <div id="alertBox" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs font-medium"></div>

        <!-- Painel de Resultados -->
        <section id="resultsSection" class="hidden space-y-4">
            
            <!-- Card Skills Extraídas -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">
                    🎯 Hard Skills Identificadas no PDF
                </h3>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-xs font-bold text-slate-700">Tecnologias encontradas:</span>
                        <span id="skillCount" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">0</span>
                    </div>
                    <div id="skillsBadges" class="flex flex-wrap gap-1"></div>
                </div>
            </div>

            <!-- Card Queries Engatilhadas -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">
                    ⚙️ String de Busca Booleana
                </h3>
                <div>
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Termos da Consulta:</span>
                    <code id="booleanQueryDisplay" class="block p-2.5 bg-slate-900 text-emerald-400 rounded-lg text-[11px] font-mono break-all mt-1"></code>
                </div>

                <div class="space-y-2 pt-2">
                    <button onclick="executarBusca('linkedin_jobs')"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        💼 Vagas no LinkedIn
                    </button>
                    <button onclick="executarBusca('linkedin_feed')"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        💬 Posts de Recrutadores (Feed)
                    </button>
                    <button onclick="executarBusca('google_ats')"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        🟢 Google Search (Gupy / Lever / Greenhouse)
                    </button>
                </div>
            </div>

        </section>

    </main>

    <script>
        let extractedPdfText = '';
        let detectedSkills = [];

        // Dicionário de tecnologias para rastreio no texto do PDF
        const TECH_DICTIONARY = [
            'javascript', 'typescript', 'react', 'next.js', 'vue', 'angular', 'node.js', 'html', 'css', 
            'tailwind', 'sass', 'graphql', 'rest api', 'docker', 'kubernetes', 'aws', 'gcp', 'sql', 
            'postgres', 'mongodb', 'git', 'ci/cd', 'jest', 'cypress', 'playwright', 'scrum', 'kanban', 
            'figma', 'python', 'java', 'c#', 'dotnet', 'microservices', 'clean architecture', 'frontend', 'backend', 'fullstack'
        ];

        function manipularArquivoPDF(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileNameDisplay').innerText = `📄 ${file.name}`;
            document.getElementById('btnAnalisar').disabled = false;
            
            // Oculta resultados anteriores caso troque o arquivo
            document.getElementById('resultsSection').classList.add('hidden');
            esconderAlerta();

            const reader = new FileReader();
            reader.onload = async function () {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let textAccumulator = '';

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        textAccumulator += textContent.items.map(item => item.str).join(' ') + ' ';
                    }

                    extractedPdfText = textAccumulator;
                } catch (err) {
                    mostrarAlerta('Erro ao ler o arquivo PDF. Certifique-se de que é um documento válido.');
                    document.getElementById('btnAnalisar').disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function alternarEstadoCarregamento(carregando) {
            const btn = document.getElementById('btnAnalisar');
            const input = document.getElementById('cvInput');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            btn.disabled = carregando;
            input.disabled = carregando;

            if (carregando) {
                btnText.innerText = 'Extraindo texto do PDF...';
                spinner.classList.remove('hidden');
            } else {
                btnText.innerText = '🚀 Analisar e Engatilhar Queries';
                spinner.classList.add('hidden');
            }
        }

        function mostrarAlerta(mensagem) {
            const box = document.getElementById('alertBox');
            box.innerText = mensagem;
            box.classList.remove('hidden');
        }

        function esconderAlerta() {
            const box = document.getElementById('alertBox');
            box.classList.add('hidden');
            box.innerText = '';
        }

        function analisarPDF() {
            if (!extractedPdfText || extractedPdfText.trim().length === 0) {
                mostrarAlerta('O PDF selecionado parece estar vazio ou é uma imagem digitalizada sem camada de texto.');
                return;
            }

            esconderAlerta();
            alternarEstadoCarregamento(true);

            setTimeout(() => {
                const lowerContent = extractedPdfText.toLowerCase();

                // Busca exata com base no dicionário técnico
                detectedSkills = TECH_DICTIONARY.filter(tech => lowerContent.includes(tech));

                alternarEstadoCarregamento(false);

                // Validação estrita
                if (detectedSkills.length === 0) {
                    document.getElementById('resultsSection').classList.add('hidden');
                    mostrarAlerta('⚠️ Nenhuma palavra-chave técnica conhecida foi identificada no texto do PDF.');
                    return;
                }

                // Renderização de Skills
                const container = document.getElementById('skillsBadges');
                container.innerHTML = '';
                detectedSkills.forEach(skill => {
                    const badge = document.createElement('span');
                    badge.className = 'text-[10px] px-2 py-0.5 rounded-md font-bold uppercase bg-blue-50 text-blue-700 border border-blue-200';
                    badge.innerText = skill;
                    container.appendChild(badge);
                });

                document.getElementById('skillCount').innerText = detectedSkills.length;

                // Montagem e exibição da Query
                const queryStr = detectedSkills.slice(0, 4).map(s => `"${s}"`).join(' OR ');
                document.getElementById('booleanQueryDisplay').innerText = queryStr;

                document.getElementById('resultsSection').classList.remove('hidden');
            }, 300);
        }

        function executarBusca(tipo) {
            if (detectedSkills.length === 0) return;

            const terms = detectedSkills.slice(0, 4).map(s => `"${s}"`).join(' OR ');
            let targetUrl = '';

            if (tipo === 'linkedin_jobs') {
                targetUrl = `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(terms)}&location=São%20Paulo%2C%20Brasil`;
            } else if (tipo === 'linkedin_feed') {
                const query = `(${terms}) ("São Paulo" OR Remoto) (vaga OR contratando)`;
                targetUrl = `https://www.linkedin.com/search/results/content/?keywords=${encodeURIComponent(query)}&sortBy=%22date_posted%22`;
            } else if (tipo === 'google_ats') {
                const query = `site:gupy.io OR site:lever.co OR site:greenhouse.io (${terms}) ("São Paulo" OR Remoto)`;
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }

            if (targetUrl) window.open(targetUrl, '_blank');
        }
    </script>
</body>

</html>
