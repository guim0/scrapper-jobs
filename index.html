<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otimizador de Vagas & ATS v2.2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans pb-16">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg leading-tight">Otimizador ATS & LinkedIn</h1>
                <p class="text-xs text-slate-400">Processamento Direto & Sem Mocks</p>
            </div>
            <span class="text-xs bg-blue-600 px-2.5 py-1 rounded-full font-mono font-semibold">v2.2.0</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 space-y-5 flex-1">

        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            
            <!-- Entrada 1: PDF -->
            <div>
                <h2 class="font-bold text-xs text-slate-700 uppercase tracking-wider mb-1">
                    📄 1. Currículo (PDF)
                </h2>
                <input type="file" id="cvInput" accept="application/pdf" class="hidden" onchange="processarPDF(event)">
                <label for="cvInput" id="cvLabel"
                    class="w-full bg-slate-50 hover:bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer transition-all">
                    <span id="cvFileName" class="text-xs font-semibold text-slate-600">Selecionar PDF do Currículo</span>
                    <span class="text-[10px] text-slate-400 mt-0.5">Processamento 100% local</span>
                </label>
            </div>

            <!-- Entrada 2: LinkedIn -->
            <div class="pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    🔗 2. Link do Perfil LinkedIn
                </label>
                <input type="url" id="linkedinUrl" placeholder="https://www.linkedin.com/in/seu-perfil"
                    class="w-full p-3 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none disabled:bg-slate-100 disabled:text-slate-400">
            </div>

            <!-- Entrada 3: Palavras-chave manuais -->
            <div class="pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                    🏷️ 3. Palavras-chave / Tecnologias Diretas
                </label>
                <input type="text" id="manualKeywords" placeholder="Ex: React, Node.js, TypeScript"
                    class="w-full p-3 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none disabled:bg-slate-100 disabled:text-slate-400">
            </div>

            <button id="btnProcessar" onclick="executarAnaliseCompleta()"
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-bold py-3 rounded-xl shadow-sm text-xs transition-all active:scale-95 flex items-center justify-center gap-2">
                <span id="btnText">🚀 Processar & Engatilhar Buscas</span>
                <span id="btnSpinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </section>

        <!-- Mensagens de Erro / Alerta Real -->
        <div id="errorAlert" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs font-medium"></div>

        <!-- Painel de Resultados -->
        <section id="resultadoContainer" class="hidden space-y-4">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">
                    🎯 Termos Identificados
                </h3>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-slate-700">Hard Skills Reais:</span>
                        <span id="hardCount" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">0</span>
                    </div>
                    <div id="hardSkillsList" class="flex flex-wrap gap-1"></div>
                </div>
            </div>

            <!-- Card Queries Engatilhadas -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-sm text-slate-900 border-b border-slate-100 pb-2">
                    ⚙️ Queries Pré-Engatilhadas
                </h3>
                <div class="space-y-2">
                    <div>
                        <span class="text-[10px] font-bold text-slate-500 uppercase">String Booleana Gerada:</span>
                        <code id="computedQueryDisplay" class="block p-2 bg-slate-900 text-emerald-400 rounded-lg text-[11px] font-mono break-all mt-1"></code>
                    </div>
                </div>

                <div class="space-y-2 pt-2">
                    <button onclick="executarBusca('linkedin_jobs')"
                        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        💼 Abrir Vagas no LinkedIn
                    </button>
                    <button onclick="executarBusca('linkedin_feed')"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        💬 Abrir Feed de Recrutadores
                    </button>
                    <button onclick="executarBusca('google_ats')"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs transition-all">
                        🟢 Abrir Google Dorking (Gupy / Lever / Greenhouse)
                    </button>
                </div>
            </div>

        </section>

    </main>

    <script>
        let cvTextParsed = '';
        let extractedHardSkills = [];

        const HARD_SKILLS_DICT = [
            'javascript', 'typescript', 'react', 'next.js', 'vue', 'angular', 'node.js', 'html', 'css', 
            'tailwind', 'sass', 'graphql', 'rest api', 'docker', 'kubernetes', 'aws', 'gcp', 'sql', 
            'postgres', 'mongodb', 'git', 'ci/cd', 'jest', 'cypress', 'playwright', 'scrum', 'kanban', 
            'figma', 'python', 'java', 'c#', 'dotnet', 'microservices', 'clean architecture', 'frontend', 'backend', 'fullstack'
        ];

        async function processarPDF(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('cvFileName').innerText = file.name;
            const reader = new FileReader();
            reader.onload = async function () {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(' ') + ' ';
                }
                cvTextParsed = fullText;
            };
            reader.readAsArrayBuffer(file);
        }

        async function fetchLinkedInHTML(url) {
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                const res = await fetch(proxyUrl);
                if (!res.ok) return null;
                const html = await res.text();
                // Remove tags HTML básicas para ler o corpo textual público
                const doc = new DOMParser().parseFromString(html, 'text/html');
                return doc.body ? doc.body.innerText : null;
            } catch (err) {
                console.warn('Não foi possível extrair dados públicos diretamente do LinkedIn URL via proxy:', err);
                return null;
            }
        }

        function setFormDisabled(disabled) {
            document.getElementById('cvInput').disabled = disabled;
            document.getElementById('linkedinUrl').disabled = disabled;
            document.getElementById('manualKeywords').disabled = disabled;
            document.getElementById('btnProcessar').disabled = disabled;
            
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            if (disabled) {
                btnText.innerText = 'Processando e Rastreando...';
                btnSpinner.classList.remove('hidden');
            } else {
                btnText.innerText = '🚀 Processar & Engatilhar Buscas';
                btnSpinner.classList.add('hidden');
            }
        }

        function showError(msg) {
            const alertBox = document.getElementById('errorAlert');
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
        }

        function clearError() {
            const alertBox = document.getElementById('errorAlert');
            alertBox.classList.add('hidden');
            alertBox.innerText = '';
        }

        async function executarAnaliseCompleta() {
            clearError();
            setFormDisabled(true);

            const linkedinUrl = document.getElementById('linkedinUrl').value.trim();
            const manualKeywords = document.getElementById('manualKeywords').value.trim();

            let aggregateText = cvTextParsed;

            // Tentativa de busca ativa no LinkedIn se preenchido
            if (linkedinUrl) {
                const linkedinHTML = await fetchLinkedInHTML(linkedinUrl);
                if (linkedinHTML) {
                    aggregateText += ' ' + linkedinHTML;
                } else {
                    // Tenta ao menos extrair termos explícitos presentes na URL slug
                    const slug = linkedinUrl.split('/in/')[1] || '';
                    aggregateText += ' ' + slug.replace(/[-_]/g, ' ');
                }
            }

            if (manualKeywords) {
                aggregateText += ' ' + manualKeywords;
            }

            const lowerText = aggregateText.toLowerCase();

            // Extração estrita sem fallbacks inventados
            extractedHardSkills = HARD_SKILLS_DICT.filter(skill => lowerText.includes(skill));

            if (manualKeywords) {
                manualKeywords.split(',').forEach(k => {
                    const clean = k.trim().toLowerCase();
                    if (clean && !extractedHardSkills.includes(clean)) {
                        extractedHardSkills.push(clean);
                    }
                });
            }

            setFormDisabled(false);

            // Validação estrita: Se não achou NADA, falha explicitamente
            if (extractedHardSkills.length === 0) {
                document.getElementById('resultadoContainer').classList.add('hidden');
                showError('⚠️ Nenhuma skill técnica foi identificada nas fontes fornecidas. Por favor, suba um PDF válido ou digite as tecnologias manualmente.');
                return;
            }

            // Renderiza resultados reais
            renderBadges('hardSkillsList', extractedHardSkills);
            document.getElementById('hardCount').innerText = extractedHardSkills.length;

            // Prepara e exibe a query engatilhada
            const queryTerms = extractedHardSkills.slice(0, 4).map(s => `"${s}"`).join(' OR ');
            document.getElementById('computedQueryDisplay').innerText = queryTerms;

            document.getElementById('resultadoContainer').classList.remove('hidden');
        }

        function renderBadges(containerId, list) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const span = document.createElement('span');
                span.className = 'text-[10px] px-2 py-0.5 rounded-md font-medium border uppercase bg-blue-50 text-blue-700 border-blue-200';
                span.innerText = item;
                container.appendChild(span);
            });
        }

        function executarBusca(tipo) {
            if (extractedHardSkills.length === 0) {
                alert('Nenhuma palavra-chave válida encontrada.');
                return;
            }

            const terms = extractedHardSkills.slice(0, 4).map(s => `"${s}"`).join(' OR ');
            let url = '';

            if (tipo === 'linkedin_jobs') {
                url = `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(terms)}&location=São%20Paulo%2C%20Brasil`;
            } else if (tipo === 'linkedin_feed') {
                const query = `(${terms}) ("São Paulo" OR Remoto) (vaga OR contratando)`;
                url = `https://www.linkedin.com/search/results/content/?keywords=${encodeURIComponent(query)}&sortBy=%22date_posted%22`;
            } else if (tipo === 'google_ats') {
                const query = `site:gupy.io OR site:lever.co OR site:greenhouse.io (${terms}) ("São Paulo" OR Remoto)`;
                url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }

            if (url) window.open(url, '_blank');
        }
    </script>
</body>

</html>
